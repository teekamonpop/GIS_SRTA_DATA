<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>Project Survey</title>

<style>
body{margin:0;font-family:Arial;background:#f3f4f6;color:#111827}
.header{height:70px;background:#8b0000;color:white;display:flex;align-items:center;justify-content:space-between;padding:0 32px}
.header a{color:white;text-decoration:none;background:rgba(255,255,255,.15);padding:10px 16px;border-radius:10px}
.container{padding:28px}
.form,.table{background:white;border-radius:18px;padding:22px;box-shadow:0 8px 24px rgba(0,0,0,.08);margin-bottom:22px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
input,select{width:100%;box-sizing:border-box;padding:12px;border:1px solid #ddd;border-radius:10px}
button{margin-top:16px;background:#8b0000;color:white;border:none;padding:13px 22px;border-radius:10px;font-weight:700;cursor:pointer}
table{width:100%;border-collapse:collapse}
th,td{padding:12px;border-bottom:1px solid #eee;text-align:left;font-size:14px}
th{background:#f9fafb}
.action-btn{margin:0 4px 0 0;padding:8px 12px}
.edit-btn{background:#374151}
.delete-btn{background:#b91c1c}
</style>
    <link rel="stylesheet" href="./css/popup.css" />
  </head>

<body>

<div class="header">
  <h2>Project Survey</h2>
  <a href="./dashboard.html">กลับ Dashboard</a>
</div>

<div class="container">

  <div class="form">
    <h3>เพิ่มโครงการสำรวจ</h3>

    <div class="grid">
      <input id="projectName" placeholder="ชื่อโครงการ">
      <input id="province" placeholder="จังหวัด">
      <input id="station" placeholder="สถานี / พื้นที่">

      <select id="region">
        <option value="ภาคเหนือ">ภาคเหนือ</option>
        <option value="ภาคตะวันออกเฉียงเหนือ">ภาคตะวันออกเฉียงเหนือ</option>
        <option value="ภาคกลาง">ภาคกลาง</option>
        <option value="ภาคใต้">ภาคใต้</option>
      </select>

      <select id="projectStatus">
        <option value="รอดำเนินการ">รอดำเนินการ</option>
        <option value="กำลังสำรวจ">กำลังสำรวจ</option>
        <option value="เร่งด่วน">เร่งด่วน</option>
        <option value="เสร็จสิ้น">เสร็จสิ้น</option>
      </select>

      <input id="owner" placeholder="ผู้รับผิดชอบ">
      <input id="surveyDate" type="date">
      <input id="note" placeholder="หมายเหตุ">
    </div>

    <button id="saveButton" type="button" onclick="saveProject()">
      บันทึกโครงการ
    </button>
  </div>

  <div class="table">
    <h3>รายการโครงการ</h3>

    <table>
      <thead>
        <tr>
          <th>ชื่อโครงการ</th>
          <th>ภาค</th>
          <th>จังหวัด</th>
          <th>สถานี</th>
          <th>วันที่สำรวจ</th>
          <th>สถานะ</th>
          <th>ผู้รับผิดชอบ</th>
          <th>จัดการ</th>
        </tr>
      </thead>

      <tbody id="projectTable"></tbody>
    </table>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./js/app-popup.js"></script>

<script>
const SUPABASE_URL =
  'https://fuvnqxiwiniigabzaejg.supabase.co';

const SUPABASE_KEY =
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ1dm5xeGl3aW5paWdhYnphZWpnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkzMjMxNjEsImV4cCI6MjA5NDg5OTE2MX0.7AECH9EkMjGHFZYh6SIrpVo1ulWrf_SK5Ui-AYpCdNg';

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

let editId = null;

function getFormData() {
  return {
    project_name: document.getElementById('projectName').value,
    province: document.getElementById('province').value,
    station: document.getElementById('station').value,
    region: document.getElementById('region').value,
    status: document.getElementById('projectStatus').value,
    owner: document.getElementById('owner').value,
    survey_date: document.getElementById('surveyDate').value || null,
    note: document.getElementById('note').value
  };
}

function clearForm() {
  editId = null;

  document.getElementById('projectName').value = '';
  document.getElementById('province').value = '';
  document.getElementById('station').value = '';
  document.getElementById('region').value = 'ภาคเหนือ';
  document.getElementById('projectStatus').value = 'รอดำเนินการ';
  document.getElementById('owner').value = '';
  document.getElementById('surveyDate').value = '';
  document.getElementById('note').value = '';

  document.getElementById('saveButton').textContent =
    'บันทึกโครงการ';
}

async function saveProject() {
  const project = getFormData();

  let result;

  if (editId) {
    result =
      await supabaseClient
        .from('survey_projects')
        .update(project)
        .eq('id', editId);
  } else {
    result =
      await supabaseClient
        .from('survey_projects')
        .insert([project]);
  }

  if (result.error) {
    console.error(result.error);
    alert('บันทึกไม่สำเร็จ');
    return;
  }

  clearForm();
  loadProjects();
}

async function loadProjects() {
  const { data, error } =
    await supabaseClient
      .from('survey_projects')
      .select('*')
      .order('created_at', { ascending: false });

  if (error) {
    console.error(error);
    alert('โหลดข้อมูลไม่สำเร็จ');
    return;
  }

  renderTable(data || []);
}

function renderTable(data) {
  const table =
    document.getElementById('projectTable');

  table.innerHTML = '';

  data.forEach(function(item) {
    table.innerHTML += `
      <tr>
        <td>${item.project_name || '-'}</td>
        <td>${item.region || '-'}</td>
        <td>${item.province || '-'}</td>
        <td>${item.station || '-'}</td>
        <td>${item.survey_date || '-'}</td>
        <td>${item.status || '-'}</td>
        <td>${item.owner || '-'}</td>
        <td>
<button class="action-btn edit-btn"
        onclick="editProject('${item.id}')">
  แก้ไข
</button>

<button class="action-btn"
        onclick="openMapProject('${item.id}')">
  ตีแปลง
</button>

<button class="action-btn delete-btn"
        onclick="deleteProject('${item.id}')">
  ลบ
</button>
        </td>
      </tr>
    `;
  });
}

async function editProject(id) {
  const { data, error } =
    await supabaseClient
      .from('survey_projects')
      .select('*')
      .eq('id', id)
      .single();

  if (error) {
    console.error(error);
    alert('โหลดข้อมูลเพื่อแก้ไขไม่สำเร็จ');
    return;
  }

  editId = id;

  document.getElementById('projectName').value = data.project_name || '';
  document.getElementById('province').value = data.province || '';
  document.getElementById('station').value = data.station || '';
  document.getElementById('region').value = data.region || 'ภาคเหนือ';
  document.getElementById('projectStatus').value = data.status || 'รอดำเนินการ';
  document.getElementById('owner').value = data.owner || '';
  document.getElementById('surveyDate').value = data.survey_date || '';
  document.getElementById('note').value = data.note || '';

  document.getElementById('saveButton').textContent =
    'อัปเดตโครงการ';

  window.scrollTo({ top: 0, behavior: 'smooth' });
}



function openMapProject(id) {
  window.location.href = './index.html?project_id=' + id;
}

async function deleteProject(id) {
  const confirmed = await window.SRTAAppPopup.confirm(
    'ต้องการลบโครงการนี้ใช่หรือไม่?',
    'ยืนยันการลบโครงการ'
  );

  if (!confirmed) {
    return;
  }

  const { error } =
    await supabaseClient
      .from('survey_projects')
      .delete()
      .eq('id', id);

  if (error) {
    console.error(error);
    alert('ลบไม่สำเร็จ');
    return;
  }
function openMapProject(projectId){

  window.location.href =
    './index.html?project_id=' +
    projectId;

}
  loadProjects();
}

loadProjects();
</script>

</body>
</html>
